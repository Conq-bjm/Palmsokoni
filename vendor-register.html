<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendor Registration | PalmSokoni</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="vendor-reg-body">

    <div class="vendor-reg-container">
        <div class="vendor-reg-header">
            <a href="vendor.html" class="reg-back"><i class="fas fa-arrow-left"></i> Back to Vendor Hub</a>
            <h2>Create Your Vendor Account</h2>
            <p>Start selling your products on PalmSokoni today.</p>
        </div>

        <form class="vendor-reg-form" onsubmit="event.preventDefault(); alert('Store account registered successfully! Redirecting...'); window.location.href='index.html';">
            <div class="form-group">
                <label>Store Name</label>
                <input type="text" placeholder="e.g. Dar Electronics Hub" required>
            </div>
            <div class="form-group">
                <label>Business Owner Full Name</label>
                <input type="text" placeholder="e.g. Baraka Juma" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" placeholder="owner@store.com" required>
            </div>
            <div class="form-group">
                <label>Phone Number (Mobile Money / Payouts)</label>
                <input type="tel" placeholder="e.g. +255 712 345 678" required>
            </div>
            <div class="form-group">
                <label>Main Product Category</label>
                <select required>
                    <option value="">Select Category</option>
                    <option value="electronics">Electronics</option>
                    <option value="fashion">Fashion & Clothing</option>
                    <option value="groceries">Foods & Groceries</option>
                    <option value="health">Health & Beauty</option>
                    <option value="industrial">Industrial Equipment</option>
                </select>
            </div>
            <button type="submit" class="submit-reg-btn">Complete Registration</button>
        </form>
    </div>

</body>
</html>
