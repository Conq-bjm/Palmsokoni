<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PalmSokoni | Market in Your Palms</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <a href="#" class="logo">PalmSokoni</a>
        
        <div class="search-container">
            <input type="text" placeholder="Search for products, brands and shops...">
            <button class="search-btn">Search</button>
        </div>

        <div class="header-icons">
            <span>Login</span>
            <span>Cart (0)</span>
        </div>
    </header>

    <section class="hero">
        <div class="hero-text">
            <h1>Market in <span>Your Palms</span></h1>
            <p>Quality products from trusted Tanzanian sellers.</p>
        </div>
    </section>

    <div class="container">
        <h3>Featured Products</h3>
        <div class="grid">
            <div class="card">
                <img src="https://via.placeholder.com/200" alt="Product">
                <h4>Sample Product Name</h4>
                <p class="price">TZS 45,000</p>
                <button style="width:100%; background: var(--orange); border:none; color:white; padding:8px; border-radius:4px; cursor:pointer;">Add to Cart</button>
            </div>
            </div>
    </div>

</body>
</html>
