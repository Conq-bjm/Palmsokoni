<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PalmSokoni | Register</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
:root {
    --primary-orange: #ff5000;
    --text-dark: #222222;
    --text-muted: #666666;
    --border-grey: #cccccc;
    --bg-light: #ffffff;
}

body {
    margin: 0;
    padding: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--bg-light);
    color: var(--text-dark);
    display: flex;
    flex-direction: column;
    height: 100vh;
}

/* --- 1 & 3. GLOBAL HEADER POSITIONING (Full width layout pinned cleanly at top left) --- */
.register-header {
    width: 100%;
    border-bottom: 1px solid #eaeaea;
    padding: 14px 40px;
    box-sizing: border-box;
    background: #ffffff;
}

.header-left-group {
    display: flex;
    align-items: center;
    gap: 24px;
    width: 100%;
}

.brand-logo {
    font-size: 26px;
    font-weight: 700;
    color: var(--primary-orange);
    text-decoration: none;
    letter-spacing: -0.5px;
}

.language-selector {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 5px 12px;
    border: 1px solid var(--border-grey);
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text-dark);
    background: #ffffff;
}

/* --- THE MAIN RESTRUCTURED CONTENT CANVAS --- */
.register-page-wrapper {
    display: flex;
    flex: 1;              /* Takes up remaining vertical screen space below header */
    width: 100%;
    overflow: hidden;
}

/* --- 1 & 2. COMPACT IMAGE LAYOUT (Scaled-down, positioned cleanly under the header) --- */
.promo-banner-panel {
    width: 38%;           /* Slashed back width dramatically so it is no longer huge */
    max-width: 460px;     /* Prevents it from spreading out on ultra-wide screens */
    height: 100%;
    padding: 20px 0 0 0; /* Gives breathable spacing on top and left margins */
    box-sizing: border-box;
}

.promo-banner-panel img {
    width: 100%;
    height: 100%;
    object-fit: cover;    /* Ensures your loaded visual file cuts and clips beautifully */
    border-top-right-radius: 16px !important;  /* Adds smooth modern edges to your image */
}

/* --- 1. OPTIMIZED ACTION SIDEBAR (Expanded and Centered Form Space) --- */
.form-content-panel {
    flex: 1;              /* Seamlessly occupies all left-over screen landscape */
    display: flex;
    align-items: center;  /* 🎯 PERFECT VERTICAL CENTERING */
    justify-content: center; /* 🎯 PERFECT HORIZONTAL CENTERING */
    background-color: #ffffff;
    box-sizing: border-box;
    padding: 20px;
}

/* Restricts form width so sign-in options stack perfectly */
.form-scroller {
    width: 100%;
    max-width: 400px;     /* Forces perfect uniform width consistency */
    box-sizing: border-box;
}

.form-scroller h1 {
    font-size: 25px;
    font-weight: 700;
    margin: 0 0 28px 0;
    text-align: left;     /* Keeps text cleanly left-aligned as requested */
    color: var(--text-dark);
}

/* --- Social Buttons Framework --- */
.social-auth-stack {
    display: flex;
    flex-direction: column;
}

.social-provider-btn {
    display: grid !important;
    grid-template-columns: 40px 1fr 40px;
    align-items: center;
    width: 100%;
    padding: 11px 0;
    border: 1px solid var(--border-grey);
    border-radius: 4px;
    background-color: #ffffff;
    font-size: 16px;
    font-weight: 600;     /* Matches your dark bold text updates */
    color: #000000 !important;
    cursor: pointer;
    box-sizing: border-box;
}

.social-provider-btn:not(:first-of-type) {
    margin-top: 12px;
}

.icon-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    grid-column: 1;
    padding-left: 12px;
}

.icon-wrapper svg {
    width: 20px;
    height: 20px;
}

.btn-text {
    grid-column: 2;
    text-align: center;
    padding-right: 12px;
}

/* --- Structural Separators --- */
.divider-boundary {
    display: flex;
    align-items: center;
    text-align: center;
    margin: 18px 0;
    color: #999999;
    font-size: 13px;
}

.divider-boundary::before,
.divider-boundary::after {
    content: '';
    flex: 1;
    border-bottom: 1px solid #e8e8e8;
}

.divider-boundary::before { margin-right: 14px; }
.divider-boundary::after { margin-left: 14px; }

/* --- Input Field Elements --- */
.input-group-label {
    display: block;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 8px;
    color: var(--text-dark);
    text-align: left;
}

.input-field-wrapper {
    width: 100%;
    margin-bottom: 20px;
}

.input-field-wrapper input {
    width: 100%;
    padding: 13px 16px;
    border: 1px solid var(--border-grey);
    border-radius: 4px;
    font-size: 15px;
    box-sizing: border-box;
    outline: none;
}

.input-field-wrapper input:focus {
    border-color: var(--primary-orange);
}

.submit-action-btn {
    width: 100%;
    padding: 13px 0;
    background-color: var(--primary-orange);
    color: #ffffff;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 20px;
}

/* --- Footer Alignment --- */
.auth-footer-meta {
    font-size: 14px;
    color: var(--text-muted);
    text-align: center;
}

.auth-footer-meta a {
    color: #111111;
    text-decoration: underline;
    font-weight: 600;
    margin-left: 4px;
}

/* --- Responsive Media Query Breakdown --- */
@media (max-width: 850px) {
    .promo-banner-panel {
        display: none; /* Auto-hides image on mobile screens for seamless viewing */
    }
}
    </style>
</head>
<body>

    <header class="register-header">
        <div class="header-left-group">
            <a href="index.html" class="brand-logo">PalmSokoni</a>
            <button class="language-selector">
                <span>English</span>
                <i data-lucide="chevron-down" style="width: 16px; height: 16px; color: #666666;"></i>
            </button>
        </div>
    </header>

    <div class="register-page-wrapper">
        
        <div class="promo-banner-panel">
            <img src="Images/signin.jpg" alt="PalmSokoni Community Graphic">
        </div>

        <div class="form-content-panel">
            <main class="form-scroller">
                <h1>Sign in or create account</h1>

                <div class="social-auth-stack">
                    <button class="social-provider-btn">
                        <span class="icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
                                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                                <path fill="#4285F4" d="M46.5 24c0-1.61-.15-3.16-.42-4.69H24v9.09h12.64c-.54 2.78-2.11 5.14-4.47 6.73l6.97 5.4C43.21 36.42 46.5 30.76 46.5 24z"/>
                                <path fill="#FBBC05" d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z"/>
                                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-6.97-5.4c-1.93 1.3-4.41 2.07-8.92 2.07-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                            </svg>
                        </span>
                        <span class="btn-text">Continue with Google</span>
                    </button>

                    <button class="social-provider-btn">
                        <span class="icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#1877F2">
                                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                            </svg>
                        </span>
                        <span class="btn-text">Continue with Facebook</span>
                    </button>

                    <button class="social-provider-btn">
                        <span class="icon-wrapper">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#0A66C2">
                                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.225 0h.003z"/>
                            </svg>
                        </span>
                        <span class="btn-text">Continue with LinkedIn</span>
                    </button>
                </div>

                <div class="divider-boundary">OR</div>

                <form action="#" method="POST" onsubmit="event.preventDefault();">
                    <label class="input-group-label" for="user-email">Enter your email address</label>
                    <div class="input-field-wrapper">
                        <input type="email" id="user-email" placeholder="Email address" required>
                    </div>

                    <button type="submit" class="submit-action-btn">Continue</button>
                </form>

                <div class="auth-footer-meta">
                    Already have an account? <a href="signin.html">Sign In</a>
                </div>
            </main>
        </div>

    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
